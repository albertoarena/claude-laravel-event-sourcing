name: shellcheck

on:
  push:
    branches: [main]
    paths: ['**/*.sh']
  pull_request:
    paths: ['**/*.sh']
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning
